# Development dependencies only. The product itself is one app container plus PostgreSQL;
# MinIO stands in for Cloudflare R2 so presigned upload is exercised in development, not discovered
# in production (SDD.md 11).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mantel
      POSTGRES_PASSWORD: mantel
      POSTGRES_DB: mantel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantel"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    # The bucket is a directory under /data, so it is created without a second image and a mc client.
    entrypoint: sh -c "mkdir -p /data/mantel && exec minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: mantel
      MINIO_ROOT_PASSWORD: mantel-development
    # Host ports avoid 9000, which another MinIO on this machine already holds. The container
    # still listens on 9000; MANTEL_S3_ENDPOINT in .env must name the host port chosen here.
    ports:
      - "${MANTEL_MINIO_PORT:-9100}:9000"
      - "${MANTEL_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
