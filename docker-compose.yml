# `docker compose up` gives a working instance: the app, a worker, PostgreSQL and MinIO.
# In deployment MinIO is replaced by Cloudflare R2, which leaves the app and PostgreSQL (SDD.md 11).
#
# `just dev` starts only postgres and minio, because the app then runs from Gradle with a reload.
services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MANTEL_DB_URL: jdbc:postgresql://postgres:5432/mantel
      MANTEL_DB_USER: mantel
      MANTEL_DB_PASSWORD: mantel
      MANTEL_S3_ENDPOINT: http://minio:9000
      # What the browser opens. With R2 or S3 this is the same as the endpoint and is left unset.
      MANTEL_S3_PUBLIC_ENDPOINT: ${MANTEL_S3_PUBLIC_ENDPOINT:-http://localhost:9100}
      MANTEL_S3_BUCKET: mantel
      MANTEL_S3_ACCESS_KEY_ID: mantel
      MANTEL_S3_SECRET_ACCESS_KEY: mantel-development
      MANTEL_PUBLIC_BASE_URL: ${MANTEL_PUBLIC_BASE_URL:-http://localhost:8080}
      MANTEL_WORKER_TOKEN: ${MANTEL_WORKER_TOKEN:-mantel-development}
    ports:
      - "${MANTEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The same image in worker mode. It renders derivatives and holds no database credentials.
  worker:
    build: .
    command: ["--worker"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      MANTEL_PUBLIC_BASE_URL: http://app:8080
      MANTEL_S3_ENDPOINT: http://minio:9000
      MANTEL_S3_BUCKET: mantel
      MANTEL_S3_ACCESS_KEY_ID: mantel
      MANTEL_S3_SECRET_ACCESS_KEY: mantel-development
      MANTEL_WORKER_TOKEN: ${MANTEL_WORKER_TOKEN:-mantel-development}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mantel
      POSTGRES_PASSWORD: mantel
      POSTGRES_DB: mantel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantel"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    # The bucket is a directory under /data, so it is created without a second image and a mc client.
    entrypoint: sh -c "mkdir -p /data/mantel && exec minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: mantel
      MINIO_ROOT_PASSWORD: mantel-development
    # Host ports avoid 9000, which another MinIO on this machine already holds. The container
    # still listens on 9000; MANTEL_S3_ENDPOINT in .env must name the host port chosen here.
    ports:
      - "${MANTEL_MINIO_PORT:-9100}:9000"
      - "${MANTEL_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
