name: release

# A tag publishes the image. A self-hoster should pull it rather than build it, and Coolify pulls
# the same thing the release notes name.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Self-hosting: https://github.com/${{ github.repository }}/blob/main/docs/self-hosting.md

  # The app is sideloaded, so the release page is the only way to get it. The job runs only when
  # the repository holds a signing key: an unsigned APK will not install, and signing with a
  # different key breaks the upgrade path of every install that already exists.
  android:
    runs-on: ubuntu-latest
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mantel.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          MANTEL_KEYSTORE: ${{ runner.temp }}/mantel.jks
          MANTEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MANTEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ../gradlew --console=plain assembleRelease

      - name: Name it after the tag
        run: |
          mv android/build/outputs/apk/release/mantel-android-release.apk \
             "mantel-android-${{ github.ref_name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: mantel-android-${{ github.ref_name }}.apk
