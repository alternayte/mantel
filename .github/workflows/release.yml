name: release

# A tag publishes the image. A self-hoster should pull it rather than build it, and Coolify pulls
# the same thing the release notes name.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag names a release; the catalogue says what the build calls itself. 0.5.0 to 0.5.2 went
      # out with the server still calling itself 0.4.0, because nothing compared the two.
      - name: The tag matches the version the build carries
        run: |
          declared=$(sed -n 's/^mantel = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but gradle/libs.versions.toml says $declared. Bump it before tagging." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Self-hosting: https://github.com/${{ github.repository }}/blob/main/docs/self-hosting.md

  # The app is sideloaded, so the release page is the only way to get it. The job runs only when
  # the repository holds a signing key: an unsigned APK will not install, and signing with a
  # different key breaks the upgrade path of every install that already exists.
  android:
    runs-on: ubuntu-latest
    # A job's `if` cannot read secrets, so the guard is an env value the steps test. Without a key
    # the job does nothing rather than publishing an APK that will not install.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - if: env.KEYSTORE == ''
        run: echo "No signing key in this repository. The release carries no APK." >> "$GITHUB_STEP_SUMMARY"

      - if: env.KEYSTORE != ''
        uses: actions/checkout@v4

      - if: env.KEYSTORE != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - if: env.KEYSTORE != ''
        # The runner image already carries the SDK and its accepted licences. The action's default
        # package list still asks for `tools`, which no longer exists, so it installs nothing.
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - if: env.KEYSTORE != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the keystore
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mantel.jks"

      - name: Build the signed APK
        if: env.KEYSTORE != ''
        working-directory: android
        env:
          MANTEL_KEYSTORE: ${{ runner.temp }}/mantel.jks
          MANTEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MANTEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ../gradlew --console=plain assembleRelease

      - name: Name it after the tag
        if: env.KEYSTORE != ''
        run: |
          mv android/build/outputs/apk/release/mantel-android-release.apk \
             "mantel-android-${{ github.ref_name }}.apk"

      - if: env.KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          files: mantel-android-${{ github.ref_name }}.apk

  # A tag that published an image should reach the instance running it. Coolify pulls; this only
  # tells it to. It waits for `image` so it never asks for a tag that does not exist yet.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    # A job's `if` cannot read secrets, so the guard is an env value the steps test. An instance
    # nobody configured is not a failed release.
    env:
      HOOKS: ${{ secrets.COOLIFY_DEPLOY_WEBHOOKS }}
      TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - if: env.HOOKS == '' || env.TOKEN == ''
        run: echo "No Coolify webhook configured. Nothing was deployed." >> "$GITHUB_STEP_SUMMARY"

      # One webhook per resource, newline separated, so the app and the worker both move and the
      # list is a secret rather than a URL in the repository.
      - name: Ask Coolify to deploy
        if: env.HOOKS != '' && env.TOKEN != ''
        run: |
          set -euo pipefail
          echo "$HOOKS" | while read -r hook; do
            [ -n "$hook" ] || continue
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X GET "$hook" -H "Authorization: Bearer $TOKEN")
            echo "$hook -> $code"
            cat /tmp/body
            echo
            case "$code" in
              2*) ;;
              *) echo "Coolify refused the deploy ($code)" >&2; exit 1 ;;
            esac
          done
