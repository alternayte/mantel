name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-tools libheif-plugin-aomenc libheif-plugin-libde265 ffmpeg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: extractions/setup-just@v2
      - run: just check

  # The Android client is its own Gradle build and its own job, so a contributor without an Android
  # SDK still has a gate that runs. The runner has one.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner image already carries the SDK and its accepted licences. The action's default
      # package list still asks for `tools`, which no longer exists, so it installs nothing.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
      - uses: extractions/setup-just@v2
      - run: just check-android

  # The unit tests run from the classpath, so they cannot see a packaging fault. The fat jar once
  # dropped Flyway's service files and silently applied no migrations at all; this job is what
  # notices. It builds the image and drives a real upload through the running stack.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Migrations applied
        run: docker compose logs app | grep -q "Successfully applied"
      - name: Upload a photo and wait for the worker
        run: bash checks/slow/stack-smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
